name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # ============================================================
      # 2. INSTALL PYTHON
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests


      # ============================================================
      # 3. ORGANIZE ROOT LEVEL SOLUTIONS
      # ============================================================

      - name: Organize solutions by topic
        run: |
          python <<'PY'

          import os
          import shutil
          import requests
          import time


          ROOT = os.getcwd()


          # ========================================================
          # TOPIC MAPPING
          # ========================================================

          TOPIC_MAP = {

              "array": "Array",
              "string": "String",
              "linked-list": "Linked-List",
              "hash-table": "Hash-Table",
              "two-pointers": "Two-Pointers",
              "sliding-window": "Sliding-Window",
              "stack": "Stack",
              "queue": "Queue",
              "binary-tree": "Binary-Tree",
              "binary-search-tree": "Binary-Search-Tree",
              "heap-priority-queue": "Heap",
              "heap": "Heap",
              "graph": "Graph",
              "backtracking": "Backtracking",
              "greedy": "Greedy",
              "dynamic-programming": "Dynamic-Programming",
              "bit-manipulation": "Bit-Manipulation",
              "math": "Math",
              "matrix": "Matrix",
              "sorting": "Sorting",
              "binary-search": "Binary-Search",
              "recursion": "Recursion",
              "trie": "Trie",
              "union-find": "Union-Find",
              "design": "Design",
              "database": "Database",
              "shell": "Shell",
              "simulation": "Simulation",

          }


          # ========================================================
          # PRIORITY
          # ========================================================

          PRIORITY = [

              "array",
              "string",
              "linked-list",
              "hash-table",
              "two-pointers",
              "sliding-window",
              "stack",
              "queue",
              "binary-tree",
              "binary-search-tree",
              "heap-priority-queue",
              "heap",
              "graph",
              "backtracking",
              "greedy",
              "dynamic-programming",
              "bit-manipulation",
              "math",
              "matrix",
              "sorting",
              "binary-search",
              "recursion",
              "trie",
              "union-find",
              "design",
              "database",
              "shell",
              "simulation",

          ]


          # ========================================================
          # TOPIC FOLDER NAMES
          # ========================================================

          TOPIC_FOLDERS = set(

              TOPIC_MAP.values()

          )


          # ========================================================
          # IGNORE
          # ========================================================

          IGNORE = {

              ".git",
              ".github",
              "README.md",
              "stats.json",

          }


          # ========================================================
          # LEETCODE GRAPHQL
          # ========================================================

          GRAPHQL = """

          query questionData($titleSlug: String!) {

            question(titleSlug: $titleSlug) {

              title

              titleSlug

              difficulty

              topicTags {

                name

                slug

              }

            }

          }

          """


          # ========================================================
          # GET LEETCODE DATA
          # ========================================================

          def get_question(slug):

              payload = {

                  "operationName": "questionData",

                  "variables": {

                      "titleSlug": slug

                  },

                  "query": GRAPHQL

              }


              headers = {

                  "Content-Type": "application/json",

                  "User-Agent": "Mozilla/5.0"

              }


              try:

                  response = requests.post(

                      "https://leetcode.com/graphql",

                      json=payload,

                      headers=headers,

                      timeout=30

                  )


                  response.raise_for_status()


                  data = response.json()


                  return (

                      data

                      .get("data", {})

                      .get("question")

                  )


              except Exception as error:

                  print(

                      "LeetCode API error:",

                      error

                  )

                  return None


          # ========================================================
          # CHOOSE TOPIC
          # ========================================================

          def choose_topic(tags):

              for topic in PRIORITY:

                  if topic in tags:

                      return TOPIC_MAP[topic]

              return "Other"


          # ========================================================
          # FIND ROOT LEVEL SOLUTIONS
          # ========================================================

          root_solutions = []


          for name in os.listdir(ROOT):

              path = os.path.join(

                  ROOT,

                  name

              )


              if not os.path.isdir(path):

                  continue


              if name in IGNORE:

                  continue


              if name.startswith("."):

                  continue


              if name in TOPIC_FOLDERS:

                  continue


              if name == "Other":

                  continue


              root_solutions.append(name)


          print()

          print("=" * 70)

          print("ROOT LEVEL SOLUTIONS FOUND")

          print("=" * 70)


          if not root_solutions:

              print("No root level solutions found.")


          for item in root_solutions:

              print(" -", item)


          print()


          # ========================================================
          # ORGANIZE ROOT LEVEL SOLUTIONS
          # ========================================================

          for slug in root_solutions:

              print()

              print("-" * 70)

              print("PROCESSING:", slug)

              print("-" * 70)


              question = get_question(slug)


              if not question:

                  print(

                      "Could not retrieve LeetCode information."

                  )

                  continue


              title = question.get(

                  "title",

                  slug

              )


              difficulty = question.get(

                  "difficulty",

                  "Unknown"

              )


              tags = [

                  tag.get("slug")

                  for tag in question.get(

                      "topicTags",

                      []

                  )

                  if tag.get("slug")

              ]


              print("Title      :", title)

              print("Difficulty :", difficulty)

              print("Tags       :", tags)


              topic = choose_topic(tags)


              print("Selected   :", topic)


              topic_path = os.path.join(

                  ROOT,

                  topic

              )


              os.makedirs(

                  topic_path,

                  exist_ok=True

              )


              source = os.path.join(

                  ROOT,

                  slug

              )


              destination = os.path.join(

                  topic_path,

                  slug

              )


              if os.path.exists(destination):

                  print(

                      "Already exists in:",

                      topic

                  )

                  continue


              if os.path.exists(source):

                  shutil.move(

                      source,

                      destination

                  )


                  print(

                      "MOVED:",

                      slug,

                      "->",

                      topic + "/" + slug

                  )


              time.sleep(1)


          print()

          print("=" * 70)

          print("ORGANIZATION FINISHED")

          print("=" * 70)

          PY


      # ============================================================
      # 4. CALCULATE TOTAL / EASY / MEDIUM / HARD
      # ============================================================

      - name: Calculate LeetCode statistics
        run: |
          python <<'PY'

          import os
          import requests


          ROOT = os.getcwd()


          # ========================================================
          # TOPIC FOLDERS
          # ========================================================

          TOPIC_FOLDERS = [

              "Array",
              "String",
              "Linked-List",
              "Hash-Table",
              "Two-Pointers",
              "Sliding-Window",
              "Stack",
              "Queue",
              "Binary-Tree",
              "Binary-Search-Tree",
              "Heap",
              "Graph",
              "Backtracking",
              "Greedy",
              "Dynamic-Programming",
              "Bit-Manipulation",
              "Math",
              "Matrix",
              "Sorting",
              "Binary-Search",
              "Recursion",
              "Trie",
              "Union-Find",
              "Design",
              "Database",
              "Shell",
              "Simulation",
              "Other",

          ]


          # ========================================================
          # GRAPHQL
          # ========================================================

          GRAPHQL = """

          query questionData($titleSlug: String!) {

            question(titleSlug: $titleSlug) {

              title

              difficulty

            }

          }

          """


          def get_difficulty(slug):

              payload = {

                  "operationName": "questionData",

                  "variables": {

                      "titleSlug": slug

                  },

                  "query": GRAPHQL

              }


              headers = {

                  "Content-Type": "application/json",

                  "User-Agent": "Mozilla/5.0"

              }


              try:

                  response = requests.post(

                      "https://leetcode.com/graphql",

                      json=payload,

                      headers=headers,

                      timeout=30

                  )


                  response.raise_for_status()


                  data = response.json()


                  question = (

                      data

                      .get("data", {})

                      .get("question")

                  )


                  if not question:

                      return None


                  return question.get(

                      "difficulty"

                  )


              except Exception as error:

                  print(

                      "API error for",

                      slug,

                      ":",

                      error

                  )

                  return None


          # ========================================================
          # COUNTERS
          # ========================================================

          easy = 0

          medium = 0

          hard = 0

          total = 0


          # ========================================================
          # SCAN EVERY TOPIC FOLDER
          # ========================================================

          for topic in TOPIC_FOLDERS:

              topic_path = os.path.join(

                  ROOT,

                  topic

              )


              if not os.path.isdir(topic_path):

                  continue


              print()

              print(

                  "Scanning topic:",

                  topic

              )


              for problem in os.listdir(topic_path):

                  problem_path = os.path.join(

                      topic_path,

                      problem

                  )


                  if not os.path.isdir(problem_path):

                      continue


                  difficulty = get_difficulty(

                      problem

                  )


                  print(

                      problem,

                      "->",

                      difficulty

                  )


                  if difficulty == "Easy":

                      easy += 1

                      total += 1


                  elif difficulty == "Medium":

                      medium += 1

                      total += 1


                  elif difficulty == "Hard":

                      hard += 1

                      total += 1


          # ========================================================
          # RESULTS
          # ========================================================

          print()

          print("=" * 70)

          print("FINAL LEETCODE STATISTICS")

          print("=" * 70)

          print("Easy   :", easy)

          print("Medium :", medium)

          print("Hard   :", hard)

          print("Total  :", total)

          print("=" * 70)


          # ========================================================
          # SAVE STATS
          # ========================================================

          with open(

              "leetcode_stats.txt",

              "w",

              encoding="utf-8"

          ) as file:

              file.write(

                  f"Easy={easy}\n"

              )

              file.write(

                  f"Medium={medium}\n"

              )

              file.write(

                  f"Hard={hard}\n"

              )

              file.write(

                  f"Total={total}\n"

              )

          PY


      # ============================================================
      # 5. UPDATE MAIN README
      # ============================================================

      - name: Update overall README
        run: |
          python <<'PY'

          import os
          import re


          ROOT = os.getcwd()


          # ========================================================
          # READ STATISTICS
          # ========================================================

          stats = {}


          with open(

              "leetcode_stats.txt",

              "r",

              encoding="utf-8"

          ) as file:

              for line in file:

                  key, value = line.strip().split("=")

                  stats[key] = int(value)


          easy = stats["Easy"]

          medium = stats["Medium"]

          hard = stats["Hard"]

          total = stats["Total"]


          # ========================================================
          # README
          # ========================================================

          README = os.path.join(

              ROOT,

              "README.md"

          )


          if os.path.exists(README):

              with open(

                  README,

                  "r",

                  encoding="utf-8"

              ) as file:

                  content = file.read()

          else:

              content = "# LeetCode_Solution\n"


          # ========================================================
          # NEW PROGRESS
          # ========================================================

          progress = f"""## Overall Progress

          | Difficulty | Solved |
          |------------|-------:|
          | 🟢 Easy | {easy} |
          | 🟡 Medium | {medium} |
          | 🔴 Hard | {hard} |
          | **Total Solved** | **{total}** |

          """


          # ========================================================
          # REMOVE OLD PROGRESS
          # ========================================================

          content = re.sub(

              r"## Overall Progress.*?(?=\n## |\Z)",

              "",

              content,

              flags=re.DOTALL

          )


          # ========================================================
          # INSERT AFTER MAIN TITLE
          # ========================================================

          title = re.search(

              r"^# .*$",

              content,

              flags=re.MULTILINE

          )


          if title:

              position = title.end()

              content = (

                  content[:position]

                  + "\n\n"

                  + progress

                  + content[position:]

              )

          else:

              content = (

                  "# LeetCode_Solution\n\n"

                  + progress

                  + content

              )


          # ========================================================
          # CLEAN
          # ========================================================

          content = re.sub(

              r"\n{4,}",

              "\n\n\n",

              content

          )


          # ========================================================
          # WRITE
          # ========================================================

          with open(

              README,

              "w",

              encoding="utf-8"

          ) as file:

              file.write(content)


          print()

          print(

              "README updated."

          )

          PY


      # ============================================================
      # 6. COMMIT
      # ============================================================

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: organize LeetCode solutions and update progress"
            git push
          fi
