name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Organize solutions and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import os
          import re
          import json
          import shutil
          import requests
          from pathlib import Path

          # ============================================================
          # CONFIGURATION
          # ============================================================

          REPO_ROOT = Path(".")
          README_FILE = REPO_ROOT / "README.md"
          STATS_FILE = REPO_ROOT / "stats.json"

          LEETCODE_GRAPHQL = "https://leetcode.com/graphql"

          HEADERS = {
              "Content-Type": "application/json",
              "User-Agent": "Mozilla/5.0"
          }

          # Topic priority used when organizing folders
          TOPIC_PRIORITY = [
              "Array",
              "String",
              "Hash Table",
              "Two Pointers",
              "Binary Search",
              "Bit Manipulation",
              "Math",
              "Dynamic Programming",
              "Greedy",
              "Backtracking",
              "Stack",
              "Queue",
              "Linked List",
              "Tree",
              "Trie",
              "Graph",
              "Heap",
              "Divide and Conquer",
              "Sliding Window",
              "Prefix Sum",
              "Recursion",
              "Simulation",
              "Sorting",
              "String Matching",
              "Knuth-Morris-Pratt Algorithm",
              "Boyer-Moore String-Search Algorithm",
              "Z Algorithm",
              "Number Theory"
          ]

          IGNORE_DIRS = {
              ".git",
              ".github",
              "__pycache__",
              "node_modules"
          }

          IGNORE_FILES = {
              "README.md",
              "stats.json"
          }

          # ============================================================
          # LEETCODE API
          # ============================================================

          def get_problem(slug):
              query = """
              query questionData($titleSlug: String!) {
                question(titleSlug: $titleSlug) {
                  questionFrontendId
                  title
                  titleSlug
                  difficulty
                  topicTags {
                    name
                  }
                }
              }
              """

              try:
                  response = requests.post(
                      LEETCODE_GRAPHQL,
                      json={
                          "query": query,
                          "variables": {
                              "titleSlug": slug
                          }
                      },
                      headers=HEADERS,
                      timeout=20
                  )

                  if response.status_code != 200:
                      return None

                  data = response.json()

                  if "data" not in data or not data["data"]["question"]:
                      return None

                  return data["data"]["question"]

              except Exception as e:
                  print(f"API error for {slug}: {e}")
                  return None


          # ============================================================
          # FIND SOLUTION FOLDERS
          # ============================================================

          def find_problem_folders():
              folders = []

              for item in REPO_ROOT.iterdir():

                  if not item.is_dir():
                      continue

                  if item.name in IGNORE_DIRS:
                      continue

                  # Existing topic folder
                  for problem_folder in item.rglob("*"):

                      if not problem_folder.is_dir():
                          continue

                      # Ignore hidden folders
                      if any(part.startswith(".") for part in problem_folder.parts):
                          continue

                      files = [
                          f for f in problem_folder.iterdir()
                          if f.is_file()
                      ]

                      # A problem folder normally contains source code
                      source_files = [
                          f for f in files
                          if f.suffix.lower() in {
                              ".java",
                              ".cpp",
                              ".c",
                              ".py",
                              ".js",
                              ".ts"
                          }
                      ]

                      if source_files:
                          folders.append(problem_folder)

              return folders


          # ============================================================
          # LANGUAGE DETECTION
          # ============================================================

          def get_language(folder):
              extensions = {
                  ".java": "Java",
                  ".cpp": "C++",
                  ".c": "C",
                  ".py": "Python",
                  ".js": "JavaScript",
                  ".ts": "TypeScript"
              }

              for file in folder.iterdir():
                  if file.is_file():
                      if file.suffix.lower() in extensions:
                          return extensions[file.suffix.lower()]

              return "Unknown"


          # ============================================================
          # FIND SLUG
          # ============================================================

          def get_slug(folder):
              return folder.name


          # ============================================================
          # COLLECT ALL PROBLEMS
          # ============================================================

          print("Scanning repository...")

          folders = find_problem_folders()

          print(f"Found {len(folders)} solution folders")

          problems = {}

          for folder in folders:

              slug = get_slug(folder)

              if slug in problems:
                  continue

              print(f"Fetching: {slug}")

              problem = get_problem(slug)

              if not problem:
                  print(f"Could not fetch metadata: {slug}")
                  continue

              number = problem["questionFrontendId"]
              title = problem["title"]
              difficulty = problem["difficulty"]

              tags = [
                  tag["name"]
                  for tag in problem.get("topicTags", [])
              ]

              language = get_language(folder)

              problems[slug] = {
                  "number": int(number),
                  "title": title,
                  "slug": slug,
                  "difficulty": difficulty,
                  "language": language,
                  "tags": tags,
                  "folder": str(folder)
              }


          # ============================================================
          # SORT PROBLEMS
          # ============================================================

          all_problems = sorted(
              problems.values(),
              key=lambda x: x["number"]
          )

          print(f"Total unique problems: {len(all_problems)}")


          # ============================================================
          # DIFFICULTY COUNT
          # ============================================================

          easy = sum(
              1 for p in all_problems
              if p["difficulty"] == "Easy"
          )

          medium = sum(
              1 for p in all_problems
              if p["difficulty"] == "Medium"
          )

          hard = sum(
              1 for p in all_problems
              if p["difficulty"] == "Hard"
          )

          total = len(all_problems)


          # ============================================================
          # CREATE CATEGORY LIST
          # ============================================================

          categories = {}

          for problem in all_problems:

              for tag in problem["tags"]:

                  if tag not in categories:
                      categories[tag] = []

                  categories[tag].append(problem)


          # Sort category problems
          for category in categories:
              categories[category].sort(
                  key=lambda x: x["number"]
              )


          # ============================================================
          # CATEGORY ORDER
          # ============================================================

          ordered_categories = []

          for topic in TOPIC_PRIORITY:
              if topic in categories:
                  ordered_categories.append(topic)

          # Add any new topics not in priority list
          for topic in sorted(categories):
              if topic not in ordered_categories:
                  ordered_categories.append(topic)


          # ============================================================
          # README GENERATION
          # ============================================================

          readme = []

          readme.append("# LeetCode_Solution")
          readme.append("")
          readme.append(
              "Automatically updated LeetCode solutions and progress."
          )
          readme.append("")

          # ============================================================
          # OVERALL PROGRESS
          # ============================================================

          readme.append("## 📊 Overall Progress")
          readme.append("")

          readme.append("| Difficulty | Solved |")
          readme.append("|---|---:|")
          readme.append(f"| 🟢 Easy | {easy} |")
          readme.append(f"| 🟡 Medium | {medium} |")
          readme.append(f"| 🔴 Hard | {hard} |")
          readme.append(f"| **Total Solved** | **{total}** |")
          readme.append("")


          # ============================================================
          # COMPLETE PROBLEM LIST
          # ============================================================

          readme.append("## 📋 Complete Problem List")
          readme.append("")

          readme.append(
              "| # | Problem | Platform | Language | Difficulty |"
          )

          readme.append(
              "|---:|---|---|---|---|"
          )

          for problem in all_problems:

              number = problem["number"]
              title = problem["title"]
              slug = problem["slug"]
              language = problem["language"]
              difficulty = problem["difficulty"]

              # Find actual relative folder
              folder = Path(problem["folder"])
              relative_folder = folder.as_posix()

              # GitHub link
              solution_link = (
                  f"./{relative_folder}"
              )

              leetcode_link = (
                  f"https://leetcode.com/problems/{slug}/"
              )

              readme.append(
                  f"| {number} | "
                  f"[{title}]({solution_link}) | "
                  f"[LeetCode #{number}]({leetcode_link}) | "
                  f"{language} | "
                  f"{difficulty} |"
              )

          readme.append("")


          # ============================================================
          # CATEGORY-WISE LIST
          # ============================================================

          for category in ordered_categories:

              category_problems = categories[category]

              readme.append(f"## {category}")
              readme.append("")

              readme.append(
                  "| # | Problem | Platform | Language |"
              )

              readme.append(
                  "|---:|---|---|---|"
              )

              for problem in category_problems:

                  number = problem["number"]
                  title = problem["title"]
                  slug = problem["slug"]
                  language = problem["language"]

                  folder = Path(problem["folder"])
                  relative_folder = folder.as_posix()

                  leetcode_link = (
                      f"https://leetcode.com/problems/{slug}/"
                  )

                  readme.append(
                      f"| {number} | "
                      f"[{title}](./{relative_folder}) | "
                      f"[LeetCode #{number}]({leetcode_link}) | "
                      f"{language} |"
                  )

              readme.append("")


          # ============================================================
          # FOOTER
          # ============================================================

          readme.append("---")
          readme.append("")
          readme.append(
              "📝 Automatically updated using GitHub Actions."
          )

          README_FILE.write_text(
              "\n".join(readme),
              encoding="utf-8"
          )


          # ============================================================
          # SAVE STATS.JSON
          # ============================================================

          stats = {
              "totalSolved": total,
              "easy": easy,
              "medium": medium,
              "hard": hard,
              "problems": [
                  {
                      "number": p["number"],
                      "title": p["title"],
                      "slug": p["slug"],
                      "difficulty": p["difficulty"],
                      "language": p["language"],
                      "tags": p["tags"]
                  }
                  for p in all_problems
              ]
          }

          STATS_FILE.write_text(
              json.dumps(stats, indent=2),
              encoding="utf-8"
          )

          print("")
          print("===================================")
          print("README UPDATED")
          print("===================================")
          print(f"Easy   : {easy}")
          print(f"Medium : {medium}")
          print(f"Hard   : {hard}")
          print(f"Total  : {total}")
          print("===================================")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md stats.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update LeetCode solutions and progress"
            git push
          fi
